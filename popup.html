<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 300px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h1 {
      font-size: 18px;
      margin-bottom: 10px;
      text-align: center;
    }

    .toggle-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.1);
      padding: 15px;
      border-radius: 8px;
      backdrop-filter: blur(10px);
    }

    .toggle-label {
      font-size: 14px;
      font-weight: 500;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255, 255, 255, 0.3);
      transition: 0.4s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #4CAF50;
    }

    input:checked + .slider:before {
      transform: translateX(26px);
    }

    .status {
      text-align: center;
      font-size: 12px;
      padding: 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.15);
    }

    .status.active {
      background: rgba(76, 175, 80, 0.3);
      color: #c8e6c9;
    }

    .status.inactive {
      background: rgba(244, 67, 54, 0.3);
      color: #ffcdd2;
    }

    .info-text {
      font-size: 12px;
      opacity: 0.8;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 Shorts Auto-Scroll</h1>

    <div class="toggle-section">
      <span class="toggle-label">Enable Auto-Scroll</span>
      <label class="switch">
        <input type="checkbox" id="toggleSwitch">
        <span class="slider"></span>
      </label>
    </div>

    <div class="info-text">
      ✨ Automatically scrolls to the next Short when the current video ends
    </div>

    <div class="status inactive" id="status">Status: Disabled</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
